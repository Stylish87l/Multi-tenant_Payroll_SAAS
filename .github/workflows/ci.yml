name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/production-readiness-hardening]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/payroll_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: payroll_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d payroll_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test -- --runInBand

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          VITE_GRAPHQL_API_URL: https://api.example.invalid/graphql
      - run: npm run build
        env:
          VITE_GRAPHQL_API_URL: https://api.example.invalid/graphql
